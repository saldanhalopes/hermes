<div class="page-view-list px-0">
  <!-- Header Section -->
  <div class="row align-items-center mb-4">
    <div class="col">
      <h3 class="mb-0 fw-700">CAPA Radar</h3>
      <p class="text-muted small mb-0">Gerenciamento de Ações Corretivas e Preventivas</p>
    </div>
    <div class="col-auto">
      <div class="d-flex gap-2">
        <button class="btn btn-light fw-600 px-3 rounded-3 shadow-sm" [routerLink]="['/capa/radar']">
          <i class="pi pi-chart-line me-2"></i>Radar
        </button>
        <button class="btn btn-primary fw-600 px-3 rounded-3 shadow-sm" [routerLink]="['/capa/new']">
          <i class="pi pi-plus me-2"></i>Nova CAPA
        </button>
      </div>
    </div>
  </div>

  <!-- Search & Filter Area -->
  <div class="berry-card mb-4 p-3 d-flex align-items-center justify-content-between flex-wrap gap-3">
    <div class="d-flex align-items-center gap-2">
      <span class="p-input-icon-left w-100" style="max-width: 300px;">
        <i class="pi pi-search"></i>
        <input type="text" pInputText placeholder="Pesquisar CAPA..." 
               class="form-control berry-input ps-5"
               (input)="dt.filterGlobal($any($event.target).value, 'contains')" />
      </span>
    </div>
    <div class="d-flex gap-2">
      <p-tag value="GxP Certified" severity="success" class="gxp-badge-tag"></p-tag>
    </div>
  </div>

  <!-- Table Section -->
  <div class="berry-card p-0 overflow-hidden shadow-sm">
    <p-table #dt 
             [value]="capas" 
             [loading]="loading" 
             [paginator]="true" 
             [rows]="10" 
             [globalFilterFields]="['capaNumber', 'title', 'source', 'status']"
             styleClass="p-datatable-modern" 
             responsiveLayout="scroll">
            
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="capaNumber" style="width: 130px">ID <p-sortIcon field="capaNumber"></p-sortIcon></th>
                    <th pSortableColumn="title">Descrição do Problema <p-sortIcon field="title"></p-sortIcon></th>
                    <th>Origem</th>
                    <th style="width: 160px" pSortableColumn="status">Status <p-sortIcon field="status"></p-sortIcon></th>
                    <th style="width: 140px">Abertura</th>
                    <th style="width: 100px"></th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-capa>
                <tr class="modern-row">
                    <td class="cm-number-cell">{{ capa.capaNumber }}</td>
                    <td class="title-cell">
                        <span class="font-weight-bold d-block">{{ capa.title }}</span>
                        <small class="text-muted d-block text-truncate" style="max-width: 300px">{{ capa.description }}</small>
                    </td>
                    <td>
                        <span class="source-tag">{{ capa.source }}</span>
                    </td>
                    <td>
                        <p-badge [value]="capa.status" [severity]="getSeverity(capa.status)"></p-badge>
                    </td>
                    <td>{{ capa.openingDate | date:'dd/MM/yyyy' }}</td>
                    <td class="actions-cell">
                        <div class="row-hover-actions">
                            <p-button icon="pi pi-eye" [rounded]="true" [text]="true" [routerLink]="['/capa', capa.id]" pTooltip="Investigar" tooltipPosition="top"></p-button>
                            <p-button icon="pi pi-file-pdf" [rounded]="true" [text]="true" severity="secondary" pTooltip="Exportar Relatório" tooltipPosition="top"></p-button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="6" class="text-center py-5">
                        <div class="empty-state">
                            <i class="pi pi-shield-check text-muted mb-3" style="font-size: 3rem"></i>
                            <p class="text-muted">Nenhum registro de CAPA encontrado.</p>
                            <p-button label="Iniciar Primeira CAPA" icon="pi pi-plus" [routerLink]="['/capa/new']" [text]="true"></p-button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
