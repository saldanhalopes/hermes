<p-card header="Histórico de Auditoria (GxP)" styleClass="premium-audit-card">
    <p-timeline [value]="events" align="left">
        <ng-template pTemplate="marker" let-event>
            <span class="custom-marker" [style.backgroundColor]="event.color">
                <i [class]="event.icon"></i>
            </span>
        </ng-template>
        <ng-template pTemplate="content" let-event>
            <div class="event-content">
                <div class="event-header">
                    <span class="event-op">{{event.status}}</span>
                    <span class="event-time">{{event.date | date:'dd/MM/yyyy HH:mm'}}</span>
                </div>
                <div class="event-user">
                    <i class="pi pi-user"></i> {{event.user}}
                </div>
                <div class="event-desc">
                    {{event.description}}
                </div>
            </div>
        </ng-template>
    </p-timeline>
</p-card>
