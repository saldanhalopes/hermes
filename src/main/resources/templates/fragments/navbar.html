<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body th:fragment="navbar">
<nav class="app-header navbar navbar-expand bg-body">
    <div class="container-fluid">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a th:href="@{/}" class="nav-link">Home</a>
            </li>
        </ul>

        <!-- Right navbar links -->
        <ul class="navbar-nav ms-auto">
            <!-- User Dropdown Menu -->
            <li class="nav-item dropdown user-menu">
                <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">
                    <i class="far fa-user me-1"></i>
                    <span class="d-none d-md-inline" sec:authentication="name">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                    <!-- Menu Header -->
                    <li class="user-header bg-primary text-white p-3 text-center">
                        <i class="fas fa-user-circle fa-3x mb-2"></i>
                        <p sec:authentication="name">User Name</p>
                    </li>
                    <!-- Menu Footer-->
                    <li class="user-footer p-2">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-default btn-flat w-100 border text-start">
                                <i class="fas fa-sign-out-alt me-2"></i>Sair
                            </button>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>
</body>
</html>
