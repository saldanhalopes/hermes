<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <!-- Title handling: Flexible and resilient -->
    <title th:if="${title == null or #lists.isEmpty(title)}">Hermes EQM</title>
    <th:block th:if="${title != null and not #lists.isEmpty(title)}" th:insert="${title}" />

    <!-- Google Font: Outfit -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}">
    <!-- Theme style (AdminLTE 4) -->
    <link rel="stylesheet" th:href="@{/webjars/admin-lte/4.0.0-beta1/dist/css/adminlte.min.css}">

    <style>
        :root {
            --hermes-primary: #6366f1;
            --hermes-dark: #0f172a;
            --hermes-accent: #1e293b;
            --hermes-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
        }

        .app-sidebar {
            background-color: var(--hermes-dark) !important;
            border-right: 1px solid var(--hermes-accent);
        }

        .sidebar-brand {
            border-bottom: 1px solid var(--hermes-accent) !important;
        }

        .nav-link.active {
            background-color: var(--hermes-primary) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .card {
            border-radius: 16px;
            border: none;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .small-box {
            border-radius: 16px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .small-box:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        @keyframes pulse-live {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .live-indicator {
            animation: pulse-live 2s infinite;
        }
    </style>
</head>

</html>
