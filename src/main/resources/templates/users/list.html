<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Gestão de Usuários - Hermes</title>
    <style>
        .glass-container {
            background-color: #0c1427;
            min-height: calc(100vh - 120px);
            padding: 2rem;
            border-radius: 20px;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
            margin: 0;
        }

        .btn-add-user {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .btn-add-user:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
            color: white;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .table {
            margin-bottom: 0;
            color: #e2e8f0;
        }

        .table thead th {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 1.25rem 1.5rem;
            font-weight: 600;
        }

        .table tbody td {
            padding: 1.25rem 1.5rem;
            vertical-align: middle;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .uid-cell {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            color: #64748b;
            font-size: 0.8rem;
        }

        .btn-action {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            background: transparent;
            text-decoration: none;
            display: inline-block;
        }

        .btn-edit {
            border: 1px solid #334155;
            color: #94a3b8;
        }

        .btn-edit:hover {
            border-color: #6366f1;
            color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }

        .btn-delete {
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
            margin-left: 0.5rem;
        }

        .btn-delete:hover {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border-color: #f87171;
        }

        .role-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .badge-admin {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .badge-user {
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="glass-container">
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
        </a>

        <div class="page-header">
            <h1 class="page-title">Gestão de Usuários</h1>
            <a href="/users/new" class="btn-add-user shadow-lg">
                <i class="fas fa-user-plus mr-2"></i> Adicionar Usuário
            </a>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show bg-success border-0 text-white rounded-lg mb-4" role="alert">
            <i class="fas fa-check-circle mr-2"></i> Operação realizada com sucesso!
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <div class="glass-card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>Usuário</th>
                            <th>Email</th>
                            <th>Papel</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="uid-cell" th:text="${u.id}">UID</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center mr-3" style="width: 32px; height: 32px; font-size: 0.8rem; font-weight: 700;">
                                        <span th:text="${#strings.substring(u.username,0,1).toUpperCase()}">U</span>
                                    </div>
                                    <span th:text="${u.username}" class="font-weight-600">Username</span>
                                </div>
                            </td>
                            <td th:text="${u.email}">Email</td>
                            <td>
                                <span th:classappend="${u.role == 'ROLE_ADMIN' ? 'badge-admin' : 'badge-user'}" 
                                      class="role-badge" 
                                      th:text="${u.role.replace('ROLE_', '')}">ADMIN</span>
                            </td>
                            <td>
                                <div class="d-flex">
                                    <a th:href="@{'/users/edit/' + ${u.id}}" class="btn-action btn-edit">
                                        <i class="fas fa-edit mr-1"></i> Editar
                                    </a>
                                    <form th:action="@{'/users/delete/' + ${u.id}}" method="post" 
                                          onsubmit="return confirm('Tem certeza que deseja excluir este usuário definitivamente? Esta ação não pode ser desfeita.');">
                                        <button type="submit" class="btn-action btn-delete">
                                            <i class="fas fa-trash-alt mr-1"></i> Excluir
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
