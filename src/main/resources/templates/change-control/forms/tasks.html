<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Plano de Ação - CM [[${request.cmNumber}]]</title>
    <style>
        .task-row {
            transition: background-color 0.2s;
        }
        .task-row:hover {
            background-color: #f8f9fa;
        }
        .progress-sm {
            height: 6px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div layout:fragment="page-title">
    Plano de Ação (CMC) - [[${request.cmNumber}]]
</div>

<div layout:fragment="content">
    <div class="container-fluid">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0"><i class="fas fa-tasks me-2"></i>Gestão de Ações (5W2H)</h5>
                <button type="button" class="btn btn-light btn-sm rounded-pill px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalTask">
                    <i class="fas fa-plus me-1"></i> Adicionar Ação
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Atividade (What)</th>
                                <th>Responsável (Who)</th>
                                <th>Prazo (When)</th>
                                <th>Progresso</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="taskList">
                            <tr th:each="task : ${request.actionPlanTasks}" class="task-row">
                                <td class="ps-4 fw-bold text-muted" th:text="${task.identifier}">000001</td>
                                <td>
                                    <div class="fw-bold" th:text="${task.what}">Descrição da ação</div>
                                    <small class="text-muted" th:text="${task.category}">Categoria</small>
                                </td>
                                <td>
                                    <div th:text="${task.whoName ?: task.who?.username}">Responsável</div>
                                    <small class="text-muted" th:text="${task.responsibleTeam}">Equipe</small>
                                </td>
                                <td>
                                    <div class="small" th:text="${#temporals.format(task.plannedEnd, 'dd/MM/yyyy')}">Data</div>
                                    <span th:if="${task.actualEnd != null}" class="badge bg-success-subtle text-success small">Real: <span th:text="${#temporals.format(task.actualEnd, 'dd/MM/yyyy')}"></span></span>
                                </td>
                                <td style="min-width: 120px;">
                                    <div class="d-flex align-items-center">
                                        <div class="flex-grow-1">
                                            <div class="progress progress-sm">
                                                <div class="progress-bar bg-success" role="progressbar" 
                                                     th:style="'width: ' + ${task.percentCompleted} + '%'" 
                                                     th:aria-valuenow="${task.percentCompleted}" 
                                                     aria-valuemin="0" aria-valuemax="100"></div>
                                            </div>
                                        </div>
                                        <span class="ms-2 small fw-bold" th:text="${task.percentCompleted + '%'}">0%</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge rounded-pill" 
                                          th:classappend="${task.status == 'Concluído' ? 'bg-success' : (task.status == 'Atrasado' ? 'bg-danger' : 'bg-warning')}"
                                          th:text="${task.status}">Pendente</span>
                                </td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-sm btn-outline-secondary border-0"><i class="fas fa-edit"></i></button>
                                    <button class="btn btn-sm btn-outline-danger border-0 ms-1" th:onclick="'deleteTask(' + ${task.id} + ')'"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(request.actionPlanTasks)}">
                                <td colspan="7" class="text-center py-5">
                                    <img src="https://img.icons8.com/isometric/100/null/empty-box.png" class="mb-3 opacity-50" /><br/>
                                    <span class="text-muted">Nenhuma ação cadastrada para este plano.</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top py-3 d-flex justify-content-end">
                <a th:href="@{/change-control/{id}(id=${request.id})}" class="btn btn-link text-muted me-3">Voltar aos Detalhes</a>
                <button type="button" class="btn btn-primary rounded-pill px-5 shadow-sm" onclick="submitForExecutionApproval()">
                    Enviar Plano para Aprovação <i class="fas fa-paper-plane ms-2"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Nova Tarefa -->
    <div class="modal fade" id="modalTask" tabindex="-1">
        <div class="modal-dialog modal-lg border-0 shadow">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Nova Ação 5W2H</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formNewTask">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">O QUÊ? (Atividade)</label>
                                <input type="text" class="form-control" id="taskWhat" required placeholder="Ação a ser executada">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">CATEGORIA</label>
                                <select class="form-select" id="taskCategory">
                                    <option value="Ação Preventiva">Ação Preventiva</option>
                                    <option value="Ação Corretiva">Ação Corretiva</option>
                                    <option value="Acompanhamento">Acompanhamento</option>
                                    <option value="Atualização Documental">Atualização Documental</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">POR QUÊ? (Justificativa)</label>
                                <input type="text" class="form-control" id="taskWhy" placeholder="Motivo da ação">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">QUEM? (Responsável)</label>
                                <input type="text" class="form-control" id="taskWhoName" placeholder="Nome do responsável">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">EQUIPE/ÁREA</label>
                                <input type="text" class="form-control" id="taskResponsibleTeam" placeholder="Área responsável">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">ONDE? (Local)</label>
                                <input type="text" class="form-control" id="taskWhere" placeholder="Local de execução">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">INÍCIO PLANEJADO</label>
                                <input type="date" class="form-control" id="taskPlannedStart">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">TÉRMINO PLANEJADO</label>
                                <input type="date" class="form-control" id="taskPlannedEnd" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold">COMO? (Método)</label>
                                <textarea class="form-control" id="taskHow" rows="2" placeholder="Descreva o método de execução..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 p-4">
                        <button type="button" class="btn btn-link text-muted" data-bs-dismiss="modal">Fechar</button>
                        <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">Salvar Ação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const requestId = [[${request.id}]];
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

        document.getElementById('formNewTask').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                what: document.getElementById('taskWhat').value,
                why: document.getElementById('taskWhy').value,
                category: document.getElementById('taskCategory').value,
                whoName: document.getElementById('taskWhoName').value,
                responsibleTeam: document.getElementById('taskResponsibleTeam').value,
                where: document.getElementById('taskWhere').value,
                how: document.getElementById('taskHow').value,
                plannedStart: document.getElementById('taskPlannedStart').value,
                plannedEnd: document.getElementById('taskPlannedEnd').value,
                status: 'Pendente'
            };

            const headers = { 'Content-Type': 'application/json' };
            if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

            try {
                const response = await fetch(`/api/change-control/requests/${requestId}/tasks`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    Swal.fire('Erro', 'Falha ao salvar tarefa.', 'error');
                }
            } catch (err) {
                Swal.fire('Erro', 'Erro na comunicação.', 'error');
            }
        });

        async function deleteTask(taskId) {
            const confirmed = await Swal.fire({
                title: 'Tem certeza?',
                text: "Esta ação não poderá ser revertida!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Sim, excluir!'
            });

            if (!confirmed.isConfirmed) return;

            const headers = {};
            if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

            try {
                const response = await fetch(`/api/change-control/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: headers
                });

                if (response.ok) {
                    window.location.reload();
                }
            } catch (err) {
                Swal.fire('Erro', 'Falha ao excluir.', 'error');
            }
        }

        async function submitForExecutionApproval() {
            const headers = {};
            if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

            try {
                const response = await fetch(`/api/change-control/requests/${requestId}/submit-plan-approval`, {
                    method: 'POST',
                    headers: headers
                });

                if (response.ok) {
                    Swal.fire('Sucesso', 'Plano enviado para aprovação.', 'success').then(() => {
                        window.location.href = `/change-control/${requestId}`;
                    });
                } else {
                    Swal.fire('Aviso', await response.text(), 'warning');
                }
            } catch (err) {
                Swal.fire('Erro', 'Erro na comunicação.', 'error');
            }
        }
        /*]]>*/
    </script>
</th:block>

</body>
</html>
